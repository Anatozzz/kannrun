<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Menu</title>
<meta name="description" content="Menu multilingue avec allergènes, par Polyglotte.">
<meta name="theme-color" content="#0b2f45">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2313506f'/%3E%3Cpath d='M18 46V18h15a10 10 0 0 1 0 20h-7v8z' fill='%23fbf7f0'/%3E%3Ccircle cx='46' cy='44' r='5' fill='%23e8743b'/%3E%3C/svg%3E">
<link rel="preload" href="../assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="menu.css">
</head>
<body>
<header class="entete">
  <div class="entete-in">
    <div class="titres">
      <h1 id="nom">…</h1>
      <p id="sous-titre" class="sous-titre"></p>
    </div>
    <label class="langue">
      <span class="sr" id="lbl-langue">Langue</span>
      <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 6h-2.9a15.7 15.7 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8ZM12 4c.8 1.2 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.8 1.9-4ZM4.3 14a8 8 0 0 1 0-4h3.3a16.5 16.5 0 0 0 0 4H4.3Zm.8 2h2.9c.3 1.3.8 2.5 1.4 3.6A8 8 0 0 1 5.1 16ZM8 8H5.1a8 8 0 0 1 4.3-3.6C8.8 5.5 8.3 6.7 8 8Zm4 12c-.8-1.2-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.8-1.9 4Zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4Zm.3 5.6c.6-1.1 1.1-2.3 1.4-3.6h2.9a8 8 0 0 1-4.3 3.6Zm1.8-5.6a16.5 16.5 0 0 0 0-4h3.3a8 8 0 0 1 0 4h-3.3Z"/></svg>
      <select id="langue" aria-labelledby="lbl-langue"></select>
    </label>
  </div>
  <nav class="onglets" id="onglets" aria-label="Sections"></nav>
</header>

<main id="contenu" class="contenu" aria-live="polite">
  <p class="etat" id="etat">Chargement du menu…</p>
</main>

<template id="tpl-filtres">
  <details class="filtres">
    <summary><span data-t="filtres"></span> <span class="compteur" hidden></span></summary>
    <div class="filtres-corps">
      <fieldset>
        <legend data-t="eviter"></legend>
        <div class="puces" data-groupe="allergenes"></div>
      </fieldset>
      <fieldset>
        <legend data-t="regime"></legend>
        <div class="puces" data-groupe="regimes"></div>
      </fieldset>
      <button type="button" class="lien" data-action="effacer" data-t="effacer"></button>
    </div>
  </details>
</template>

<footer class="pied" id="pied"></footer>

<script src="i18n.js"></script>
<script src="menu.js"></script>
</body>
</html>
